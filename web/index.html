<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云网智能运维监控大屏</title>
<style>
/* ---------- 主题变量（色彩统一在此定义） ---------- */
:root{
  --bg:#040E1E; --bg2:#03192E;
  --panel:#081A30; --panel2:#0A2038;
  --line:rgba(0,229,255,.22); --line2:rgba(61,139,255,.18);
  --cyan:#00E5FF; --blue:#3D8BFF; --brand:#0085D0;
  --txt:#D8ECFA; --sub:#7FA6C6; --dim:#4A6E92;
  --crit:#FF4D5E; --major:#FF9F40; --urgent:#FFD666; --ok:#2EE6A6;
  --num-font:"DIN Alternate","Bahnschrift","Helvetica Neue",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#02060F}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--txt);font-size:14px}

/* ---------- 舞台：固定 1920x1080 设计稿，JS 按窗口等比缩放 ---------- */
#stage{
  width:1920px;height:1080px;position:absolute;left:50%;top:50%;
  transform-origin:center center;
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(0,133,208,.18), transparent 60%),
    radial-gradient(900px 600px at 50% 115%, rgba(0,229,255,.08), transparent 60%),
    linear-gradient(180deg,#051226 0%, var(--bg) 45%, #030B18 100%);
  display:flex;flex-direction:column;
}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,229,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.03) 1px,transparent 1px);
  background-size:48px 48px;}

/* ---------- 顶栏 ---------- */
header{height:86px;position:relative;flex:none;display:flex;align-items:center;justify-content:center;z-index:5}
header::after{content:"";position:absolute;left:2%;right:2%;bottom:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(0,229,255,.55) 20%,rgba(0,229,255,.9) 50%,rgba(0,229,255,.55) 80%,transparent)}
h1{font-size:32px;letter-spacing:6px;font-weight:600;
  background:linear-gradient(180deg,#FFFFFF 20%,#8FE9FF 60%,#38B6FF);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 24px rgba(0,180,255,.35)}
.h-side{position:absolute;top:0;height:84px;display:flex;align-items:center;gap:26px}
.h-side.l{left:28px}.h-side.r{right:28px}
.h-clock{font-family:var(--num-font);font-variant-numeric:tabular-nums;font-size:26px;color:#BFEFFF;letter-spacing:1px}
.h-date{font-size:12px;color:var(--sub);letter-spacing:2px;text-align:right}

/* ---------- 三栏布局 ---------- */
main{flex:1;display:flex;gap:14px;padding:14px 20px 18px;min-height:0;position:relative;z-index:2}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
.col.l{width:452px;flex:none}
.col.c{flex:1;min-width:0}
.col.r{width:512px;flex:none}

/* ---------- 面板外框（四角高亮 + 扫光标题栏） ---------- */
.panel{background:linear-gradient(180deg,rgba(10,32,56,.92),rgba(6,20,38,.92));
  border:1px solid var(--line2);position:relative;display:flex;flex-direction:column;min-height:0;
  box-shadow:inset 0 0 30px rgba(0,90,160,.12)}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none}
.panel::before{left:-1px;top:-1px;border-left:2px solid var(--cyan);border-top:2px solid var(--cyan)}
.panel::after{right:-1px;bottom:-1px;border-right:2px solid var(--cyan);border-bottom:2px solid var(--cyan)}
.p-hd{flex:none;height:38px;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:linear-gradient(90deg,rgba(0,133,208,.28),rgba(0,133,208,.04) 70%);
  border-bottom:1px solid var(--line2)}
.p-hd .tick{width:5px;height:16px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);transform:skewX(-14deg)}
.p-hd b{font-size:16px;letter-spacing:2px;font-weight:600;color:#EAF7FF;white-space:nowrap;flex:none}
.p-hd .en{font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:3px}
.p-bd{flex:1;min-height:0;padding:10px 12px;position:relative;overflow:hidden}

/* ---------- KPI 网格 ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;height:100%}
.kpi{border:1px solid var(--line2);background:linear-gradient(180deg,rgba(13,42,72,.6),rgba(8,26,48,.3));
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.kpi b{font-family:var(--num-font);font-variant-numeric:tabular-nums;font-size:34px;line-height:1.15;font-weight:600;color:#DFF6FF;text-shadow:0 0 16px rgba(0,229,255,.45)}
.kpi span{font-size:11.5px;color:var(--sub)}
.kpi.hot b{color:var(--urgent);text-shadow:0 0 16px rgba(255,214,102,.4)}

/* ---------- 地市退服条形图 ---------- */
.bars{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;padding:8px 16px}
.crow{display:flex;align-items:center;gap:14px}
.crow .name{width:60px;flex:none;text-align:right;font-size:16px;letter-spacing:3px;color:var(--txt)}
.crow .track{flex:1;height:24px;display:flex;background:rgba(8,26,48,.55);border:1px solid var(--line2)}
.seg{height:100%}
.seg.g4{background:linear-gradient(90deg,rgba(0,229,255,.25),rgba(0,229,255,.75))}
.seg.g5{background:linear-gradient(90deg,rgba(61,139,255,.30),rgba(61,139,255,.85))}
.crow .val{width:56px;flex:none;font-family:var(--num-font);font-variant-numeric:tabular-nums;font-size:20px;color:#DFF6FF;text-shadow:0 0 12px rgba(0,229,255,.35)}
.legend{flex:none;display:flex;justify-content:center;gap:22px;padding:6px 0 2px;font-size:11px;color:var(--sub)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.legend .g4{background:rgba(0,229,255,.65)}
.legend .g5{background:rgba(61,139,255,.75)}

/* ---------- Agent 诊断对话窗 ---------- */
.chat-log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.msg{font-size:12.5px;line-height:1.65;padding:8px 10px;border:1px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;max-width:85%;color:var(--cyan);background:rgba(0,229,255,.07)}
.msg.agent{align-self:flex-start;max-width:96%;color:var(--txt);background:rgba(13,42,72,.5)}
.msg.trace{align-self:flex-start;color:var(--dim);font-size:11px;border-style:dashed;padding:4px 8px}
.chat-input{flex:none;display:flex;gap:8px;margin-top:10px}
.chat-input input{flex:1;background:rgba(8,26,48,.7);border:1px solid var(--line);color:var(--txt);padding:9px 10px;font-size:13px;outline:none}
.chat-input input::placeholder{color:var(--dim)}
.chat-input button{background:rgba(0,229,255,.12);border:1px solid var(--line);color:var(--cyan);padding:0 18px;font-size:13px;letter-spacing:2px;cursor:pointer}
.chat-input button:disabled{opacity:.45;cursor:wait}

/* ---------- 处置工单列表 ---------- */
.ticket{border:1px solid var(--line2);border-left:3px solid var(--urgent);border-radius:0;
  background:rgba(13,42,72,.45);padding:8px 10px;margin-bottom:8px}
.t-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#EAF7FF}
.t-status{font-size:11px;color:var(--urgent);border:1px solid rgba(255,214,102,.4);padding:1px 8px}
.t-body{font-size:12px;color:var(--txt);line-height:1.5;margin:4px 0}
.t-meta{font-size:10.5px;color:var(--dim)}

/* ---------- 智能调度台 ---------- */
.proposal{border:1px solid var(--line);border-left:3px solid var(--crit);border-radius:0;
  background:rgba(13,42,72,.5);padding:9px 11px;margin-bottom:9px}
.proposal.done{border-left-color:var(--dim);opacity:.55}
.pp-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#EAF7FF}
.pp-pri{font-size:11px;color:var(--crit);border:1px solid rgba(255,77,94,.45);padding:1px 8px}
.pp-pri.done{color:var(--dim);border-color:var(--line2)}
.pp-body{font-size:12px;color:var(--txt);line-height:1.55;margin:5px 0;white-space:pre-wrap}
.pp-diag{font-size:11.5px;color:var(--sub);line-height:1.55;margin:4px 0;border-top:1px dashed var(--line2);padding-top:5px}
.pp-ops{display:flex;gap:8px;margin-top:6px}
.pp-ops button{font-size:12px;letter-spacing:1px;padding:4px 14px;cursor:pointer;
  background:rgba(0,229,255,.12);border:1px solid var(--line);color:var(--cyan)}
.pp-ops button.reject{background:transparent;color:var(--dim);border-color:var(--line2)}
.pp-ops button:disabled{opacity:.4;cursor:wait}

/* ---------- 导演遥控（演示控制） ---------- */
.demo-ctl{display:flex;align-items:center;gap:8px}
.demo-ctl span{font-size:11px;color:var(--dim);letter-spacing:1px}
.demo-ctl button{font-size:11px;padding:3px 10px;cursor:pointer;letter-spacing:1px;
  background:rgba(0,229,255,.08);border:1px solid var(--line2);color:var(--sub)}
.demo-ctl button:hover{color:var(--cyan);border-color:var(--line)}

/* ---------- 空状态占位 ---------- */
.placeholder{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--dim)}
.placeholder b{font-size:13px;letter-spacing:3px;font-weight:400}
.placeholder span{font-size:11px;letter-spacing:1px;border:1px solid var(--line2);padding:2px 10px}
</style>
</head>
<body>

<div id="stage">
  <header>
    <div class="h-side l"><div class="h-clock" id="clock">--:--:--</div></div>
    <h1>云网智能运维监控大屏</h1>
    <div class="h-side r">
      <div class="demo-ctl">
        <span id="actLabel">--</span>
        <button id="actNextBtn">下一幕</button>
        <button id="actResetBtn">重置</button>
      </div>
      <div class="h-date" id="dateText">----</div>
    </div>
  </header>

  <main>
    <!-- 左栏 -->
    <div class="col l">
      <section class="panel" style="height:220px">
        <div class="p-hd"><i class="tick"></i><b>网络运行总览</b><span class="en">NETWORK OVERVIEW</span></div>
        <div class="p-bd">
          <div class="kpi-grid">
            <div class="kpi"><b id="kpiOutage">--</b><span>全网退服总数</span></div>
            <div class="kpi"><b id="kpiCities">--</b><span>覆盖地市</span></div>
            <div class="kpi hot"><b id="kpiAlarms">--</b><span>告警总数</span></div>
          </div>
        </div>
      </section>
      <section class="panel" style="flex:1">
        <div class="p-hd"><i class="tick"></i><b>处置工单</b><span class="en">TICKETS</span></div>
        <div class="p-bd" style="overflow-y:auto"><div id="ticketList"></div></div>
      </section>
    </div>

    <!-- 中栏 -->
    <div class="col c">
      <section class="panel" style="flex:1;min-height:0">
        <div class="p-hd"><i class="tick"></i><b>地市退服分布</b><span class="en">CITY OUTAGE</span></div>
        <div class="p-bd" style="display:flex;flex-direction:column">
          <div class="bars" id="cityBars"></div>
          <div class="legend"><span><i class="g4"></i>4G</span><span><i class="g5"></i>5G</span></div>
        </div>
      </section>
      <section class="panel" style="flex:1;min-height:0">
        <div class="p-hd"><i class="tick"></i><b>智能调度台</b><span class="en">AI DISPATCH CONSOLE</span></div>
        <div class="p-bd" style="overflow-y:auto"><div id="proposalList"></div></div>
      </section>
    </div>

    <!-- 右栏 -->
    <div class="col r">
      <section class="panel" style="flex:1">
        <div class="p-hd"><i class="tick"></i><b>智能诊断</b><span class="en">DIAGNOSIS AGENT</span></div>
        <div class="p-bd" style="display:flex;flex-direction:column">
          <div class="chat-log" id="chatLog">
            <div class="msg agent">我是网络诊断 Agent，可基于实时数据回答。试试：
· 现在全网状况如何？
· 苏州的情况需要关注吗？
· 哪个地市 4G 问题最突出？</div>
          </div>
          <div class="chat-input">
            <input id="questionInput" placeholder="输入运维问题，回车或点击诊断">
            <button id="sendBtn">诊断</button>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
/* ---- 舞台缩放：按窗口大小等比缩放 1920x1080 设计稿 ---- */
function fitStage(){
  const scale = Math.min(innerWidth/1920, innerHeight/1080);
  document.getElementById("stage").style.transform = `translate(-50%,-50%) scale(${scale.toFixed(4)})`;
}

/* ---- 顶栏时钟 ---- */
function tickClock(){
  const d = new Date(), pad = n => String(n).padStart(2,"0");
  document.getElementById("clock").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  document.getElementById("dateText").textContent =
    `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} 星期${"日一二三四五六"[d.getDay()]}`;
}

/* ---- KPI：取数 → 解析 → 填入 ---- */
async function renderKpi(){
  const data = await (await fetch("/api/kpi")).json();
  document.getElementById("kpiOutage").textContent = data.outage_total;
  document.getElementById("kpiCities").textContent = data.city_count;
  document.getElementById("kpiAlarms").textContent = data.alarm_total;
}

/* ---- 地市退服条形图：明细列表 → 按最大值归一化的分段条 ---- */
async function renderCityBars(){
  const data = await (await fetch("/api/city-outage")).json();
  const cities = data.cities;                                  // 服务端已按 total 降序
  const max = Math.max(...cities.map(c => c.total));           // 用最大值做宽度基准
  document.getElementById("cityBars").innerHTML = cities.map(c => {
    const segments = Object.entries(c.by_tech).map(([tech, value]) =>
      `<div class="seg ${tech === "4G" ? "g4" : "g5"}"
            style="width:${(value/max*100).toFixed(1)}%"
            title="${c.city} ${tech}：${value}"></div>`).join("");
    return `<div class="crow">
      <span class="name">${c.city}</span>
      <div class="track">${segments}</div>
      <b class="val">${c.total}</b>
    </div>`;
  }).join("");
}

/* ---- 处置工单列表：Agent 建的单实时出现在这里 ---- */
async function renderTickets(){
  const data = await (await fetch("/api/tickets")).json();
  document.getElementById("ticketList").innerHTML = data.tickets.length
    ? data.tickets.map(t => `
      <div class="ticket">
        <div class="t-top"><b>#${t.id} ${t.city}</b><span class="t-status">${t.status}</span></div>
        <div class="t-body">${t.summary}</div>
        <div class="t-meta">${t.created_at} · 时限 ${t.deadline_hours} 小时 · 来源 ${t.source}</div>
      </div>`).join("")
    : '<div class="placeholder"><b>暂 无 工 单</b><span>可在右侧要求 Agent 建单</span></div>';
}

/* ---- 智能调度台：建议单队列，人工确认/否决（审批门） ---- */
let lastProposalsJson = "";      // 数据未变化不重绘——避免轮询销毁用户正要点击的按钮

async function renderProposals(){
  const data = await (await fetch("/api/proposals")).json();
  const snapshot = JSON.stringify(data);
  if (snapshot === lastProposalsJson) return;
  lastProposalsJson = snapshot;
  document.getElementById("proposalList").innerHTML = data.proposals.length
    ? data.proposals.map(p => {
        const pending = p.status === "待确认";
        return `
        <div class="proposal ${pending ? "" : "done"}">
          <div class="pp-top"><b>建议单 #${p.id} ${p.city}</b>
            <span class="pp-pri ${pending ? "" : "done"}">${p.priority} · 限 ${p.deadline_hours}h · ${p.status}</span></div>
          <div class="pp-body">${p.summary}</div>
          <div class="pp-diag">${p.diagnosis}</div>
          ${pending ? `<div class="pp-ops">
            <button onclick="actOnProposal(${p.id}, 'confirm', this)">确认并派单</button>
            <button class="reject" onclick="actOnProposal(${p.id}, 'reject', this)">否决</button>
          </div>` : (p.ticket_id ? `<div class="pp-diag">已转工单 #${p.ticket_id}</div>` : "")}
        </div>`;
      }).join("")
    : '<div class="placeholder"><b>暂 无 待 研 判 事 件</b><span>调度器监听告警中</span></div>';
}

async function actOnProposal(id, action, btn){
  btn.disabled = true;
  await fetch(`/api/proposals/${id}/${action}`, {method: "POST"});
  lastProposalsJson = "";        // 状态已变，强制下一次重绘
  renderProposals();
  renderTickets();
}

/* ---- 导演遥控：演示剧本推进 ---- */
async function renderScenario(){
  const data = await (await fetch("/api/scenario")).json();
  document.getElementById("actLabel").textContent = data.act.title;
}

async function scenarioControl(action){
  await fetch(`/api/scenario/${action}`, {method: "POST"});
  renderScenario();
  renderKpi();
  renderCityBars();
}

document.getElementById("actNextBtn").addEventListener("click", () => scenarioControl("next"));
document.getElementById("actResetBtn").addEventListener("click", () => scenarioControl("reset"));

/* ---- Agent 诊断对话：提问 → 工具轨迹实时出现 → 答案逐字打出 ---- */
function appendMessage(kind, text){
  const log = document.getElementById("chatLog");
  const node = document.createElement("div");
  node.className = "msg " + kind;
  node.textContent = text;
  log.appendChild(node);
  log.scrollTop = log.scrollHeight;
  return node;
}

const SESSION_ID = "web-" + Math.random().toString(36).slice(2);   // 每次打开大屏 = 一个新会话

async function sendDiagnosis(){
  const input = document.getElementById("questionInput"), btn = document.getElementById("sendBtn");
  const question = input.value.trim();
  if (!question || btn.disabled) return;
  input.value = "";
  appendMessage("user", question);
  btn.disabled = true; btn.textContent = "诊断中";
  let answerNode = null;
  try {
    /* SSE 流式：事件一到就渲染 */
    const response = await fetch("/api/agent/stream", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question, session_id: SESSION_ID}),
    });
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      let boundary;
      while ((boundary = buffer.indexOf("\n\n")) >= 0) {        /* SSE 消息以空行分隔 */
        const line = buffer.slice(0, boundary); buffer = buffer.slice(boundary + 2);
        if (!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.event === "tool") {
          appendMessage("trace", `[工具] ${ev.tool} ${ev.args} → ${ev.summary}`);
        } else if (ev.event === "text") {
          if (!answerNode) answerNode = appendMessage("agent", "");
          answerNode.textContent += ev.text;
          answerNode.parentElement.scrollTop = answerNode.parentElement.scrollHeight;
        } else if (ev.event === "error") {
          appendMessage("agent", "出错了：" + ev.message);
        }
      }
    }
  } catch (err) {
    appendMessage("agent", "请求失败：" + err);
  }
  btn.disabled = false; btn.textContent = "诊断";
}

document.getElementById("sendBtn").addEventListener("click", sendDiagnosis);
document.getElementById("questionInput").addEventListener("keydown", e => { if (e.key === "Enter") sendDiagnosis(); });

fitStage(); addEventListener("resize", fitStage);
tickClock(); setInterval(tickClock, 1000);
renderKpi(); setInterval(renderKpi, 5000);
renderCityBars(); setInterval(renderCityBars, 5000);
renderTickets(); setInterval(renderTickets, 5000);
renderProposals(); setInterval(renderProposals, 3000);
renderScenario(); setInterval(renderScenario, 5000);
</script>
</body>
</html>
