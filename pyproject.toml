[project]
name = "telecom-noc-agent"
version = "1.3.0"
description = "AI agent for telecom network operations: hand-written agent loop, RAG, MCP, controlled write-actions, NOC dashboard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.128.8",
    "uvicorn==0.39.0",
    "requests==2.32.4",
    "openai==1.95.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1"]
langgraph = ["langgraph==0.6.11", "langchain-openai==0.3.35"]

[tool.pytest.ini_options]
testpaths = ["tests"]
